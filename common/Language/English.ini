Lstbx_TurtorialLabels@0=1. Select the color space (if no adjustment is needed， skip to step 4.)
Lstbx_TurtorialLabels@1=2. Modify the value of the adjustment bar to make the black and white image close to the shape of the circuit board
Lstbx_TurtorialLabels@2=3. Adjust the size of filter1 and filter2 to filter out unnecessary information
Lstbx_TurtorialLabels@3=4. Click SearchCutPoint
Lstbx_TurtorialLabels@4=1. Adjust the cut point filter conditions
Lstbx_TurtorialLabels@5=2. Filter out all cutting points (yellow dots) on the screen
Lstbx_TurtorialLabels@6=3. Click RoutesSetting
Lstbx_TurtorialLabels@7=1. Select the GroupSelect (up to 12 groups)， select the type setting mode (select automatic identification and go to step 3)
Lstbx_TurtorialLabels@8=2. Select the cutting path type， alignment direction， and movement method
Lstbx_TurtorialLabels@9=3. Click Add， Remove or Modify， and select (click) the yellow dot in the frame to set the path type for the current group
Lstbx_TurtorialLabels@10=4. Repeat steps 1~3， and click the simulation to view the results after completion
Lstbx_TurtorialLabels@11=5. Click to generate path
Lstbx_TurtorialLabels@12=1. Modify the threshold value and the value of the brightness adjustment bar to make the black and white image close to the shape of the circuit board (if no correction is required， skip to step 3.)
Lstbx_TurtorialLabels@13=2. Confirm the path point correction effect (the green circle should be aligned with the edge of the board)
Lstbx_TurtorialLabels@14=3. Click to start generating path

